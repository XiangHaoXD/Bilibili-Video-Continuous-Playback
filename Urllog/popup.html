<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>URL Logger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 272px;
      background: #f4f6f9;
      color: #1a1a2e;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      padding: 11px 14px 10px;
      background: white;
      border-bottom: 1px solid #e9ecef;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    /* ── Body ── */
    .body {
      padding: 10px 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* ── 合并：状态 + 切换按钮 ── */
    #toggleBtn {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: filter 0.15s;
    }
    #toggleBtn:hover:not(:disabled) { filter: brightness(0.95); }
    #toggleBtn:disabled { opacity: 0.55; cursor: not-allowed; }

    #toggleBtn.inactive {
      background: #eef0f5;
      color: #555;
    }
    #toggleBtn.active {
      background: #e6f4ea;
      color: #2e7d32;
    }

    .toggle-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .inactive .toggle-dot { background: #aaa; }
    .active  .toggle-dot {
      background: #43a047;
      box-shadow: 0 0 0 3px rgba(67,160,71,0.25);
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    .toggle-texts { display: flex; flex-direction: column; gap: 1px; }
    #statusText    { font-size: 11px; opacity: 0.65; }
    #toggleBtnLabel{ font-size: 13px; font-weight: 600; }

    /* ── 统计行 ── */
    .stats-row {
      display: flex;
      gap: 6px;
    }
    .stat-card {
      flex: 1;
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 7px 10px;
    }
    .stat-label { font-size: 10px; color: #999; margin-bottom: 2px; }
    .stat-value { font-size: 14px; font-weight: 700; color: #1a1a2e; }

    /* ── 操作按钮 ── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn {
      padding: 7px 8px;
      border: 1px solid #e9ecef;
      border-radius: 7px;
      background: white;
      color: #333;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn:hover:not(:disabled) { background: #f5f5f5; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { color: #d32f2f; border-color: #ffd0d0; }
    .btn-danger:hover:not(:disabled) { background: #fff5f5; }

    /* ── 设置行 ── */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      gap: 8px;
    }
    .settings-label { font-size: 12px; color: #444; line-height: 1.3; }

    /* Toggle switch */
    .switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 19px;
      cursor: pointer; transition: background 0.2s;
    }
    .slider::before {
      content: ""; position: absolute;
      width: 15px; height: 15px;
      left: 2px; top: 2px;
      background: white; border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #43a047; }
    input:checked + .slider::before { transform: translateX(15px); }
    input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

    /* ── 消息提示 ── */
    .message {
      display: none;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
    }
    .message.success { background: #e8f5e9; color: #2e7d32; }
    .message.error   { background: #ffebee; color: #c62828; }

    /* ── Footer ── */
    .footer {
      padding: 7px 10px;
      background: white;
      border-top: 1px solid #e9ecef;
      display: flex;
      gap: 5px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #eef0fb;
      color: #5c6bc0;
      font-weight: 500;
    }

    /* ── 确认弹窗 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 10px;
      padding: 16px 14px 14px;
      width: 220px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .modal h3 { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    .modal p  { font-size: 12px; color: #666; margin-bottom: 13px; line-height: 1.4; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .btn-confirm {
      padding: 7px;
      border: none;
      border-radius: 7px;
      background: #d32f2f;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-confirm:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <h1>URL Logger</h1>
  </div>

  <div class="body">

    <!-- 合并：状态指示 + 切换按钮 -->
    <button id="toggleBtn" class="inactive">
      <span class="toggle-dot"></span>
      <span class="toggle-texts">
        <span id="statusText">记录已停止</span>
        <span id="toggleBtnLabel">开始记录</span>
      </span>
    </button>

    <!-- 统计 -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">今日已记录</div>
        <div class="stat-value" id="todayCount">0 条</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">日期</div>
        <div class="stat-value" id="todayDate">--</div>
      </div>
    </div>

    <!-- 操作 -->
    <div class="actions">
      <button class="btn" id="downloadBtn">⬇ 下载今日日志</button>
      <button class="btn btn-danger" id="clearBtn">✕ 清空今日日志</button>
    </div>

    <!-- 设置 -->
    <div class="settings-row">
      <span class="settings-label">视频结束后自动切换标签页</span>
      <label class="switch">
        <input type="checkbox" id="autoSwitchToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- 消息提示 -->
    <div id="message" class="message"></div>

  </div>

  <div class="footer">
    <span class="badge">Manifest V3</span>
    <span class="badge">Lightweight Build</span>
  </div>

  <!-- 确认清空弹窗 -->
  <div id="confirmModal" class="modal-overlay" aria-hidden="true">
    <div class="modal">
      <h3>确认清空今日日志？</h3>
      <p>此操作会删除今天的全部记录，且无法恢复。</p>
      <div class="modal-actions">
        <button class="btn" id="cancelClearBtn">取消</button>
        <button class="btn-confirm" id="confirmClearBtn">确认清空</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
